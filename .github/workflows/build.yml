
name: CloudMemo Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudmemo-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17 (No Gradle cache detection)
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find ZIP and extract
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/cloudmemo-project"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/cloudmemo-project"
            SEARCH_DIR="$RUNNER_TEMP/cloudmemo-project"
          else
            echo "No ZIP found. Checking repository project."
            SEARCH_DIR="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$SEARCH_DIR" -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: Root build.gradle not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App module Gradle file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project detected successfully:"
          echo "$PROJECT_DIR"

      # 4. Install Android command-line tools
      - name: Setup Android SDK Manager
        uses: android-actions/setup-android@v3

      # 5. Find SDK Manager
      - name: Locate SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not configured"
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: SDK Manager executable not found"
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDK Manager found successfully"

      # 6. Accept licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses > /dev/null || true

      # 7. Install SDK packages individually with retry
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          install_package() {
            PACKAGE="$1"
            SUCCESS=0

            for ATTEMPT in 1 2 3; do
              echo "Installing $PACKAGE (attempt $ATTEMPT/3)"

              if "$SDKMANAGER" \
                --sdk_root="$SDK_ROOT" \
                --install "$PACKAGE"; then
                SUCCESS=1
                break
              fi

              echo "Installation attempt failed."
              sleep 10
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Could not install $PACKAGE"
              exit 1
            fi
          }

          install_package "platform-tools"
          install_package "platforms;android-35"
          install_package "build-tools;36.0.0"

          echo "All required SDK packages installed."

      # 8. Setup Gradle without wrapper
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 9. Verify environment
      - name: Verify Java Gradle and SDK
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -d "$SDK_ROOT/platform-tools"

          echo "Java, Gradle and Android SDK verified."

      # 10. Build APK
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            assembleDebug

      # 11. Verify APK
      - name: Verify APK Output
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not generated"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudMemo-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
