
name: Android APK Build from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Find ZIP File
      - name: Find Project ZIP
        id: findzip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root!"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      # 3. Extract ZIP
      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "ZIP extracted successfully!"

      # 4. Locate Gradle Project
      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            -name gradlew -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found!"
            echo "Your ZIP must contain a complete Android Studio project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      # 5. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 7. Accept Android Licenses
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # 8. Grant Gradle Permission
      - name: Grant Gradle Permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      # 9. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
